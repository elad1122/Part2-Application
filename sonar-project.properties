# SonarQube (SAST) – used by the "sast" job in .github/workflows/ci-cd.yml,
# which runs a SonarQube Community server as a service container for each pipeline run.
sonar.projectKey=sample-nodejs
sonar.projectName=sample-nodejs

sonar.sources=.
sonar.inclusions=**/*.js,Dockerfile
sonar.exclusions=node_modules/**,helm/**
sonar.sourceEncoding=UTF-8

# Accepted finding (risk mitigated outside the code – this pipeline makes no app code changes):
#   javascript:S5689 "framework discloses version information" (Express X-Powered-By header).
#   Mitigation: the Helm chart's Traefik Middleware strips X-Powered-By from every response at
#   the ingress (helm/sample-nodejs/templates/middleware.yaml). Scoped to this rule and file only;
#   any other finding still fails the Quality Gate.
sonar.issue.ignore.multicriteria=xpoweredby
sonar.issue.ignore.multicriteria.xpoweredby.ruleKey=javascript:S5689
sonar.issue.ignore.multicriteria.xpoweredby.resourceKey=app.js
