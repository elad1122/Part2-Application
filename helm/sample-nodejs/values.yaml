# Default values for sample-nodejs.


replicaCount: 2

image:

  repository: ghcr.io/elad1122/sample-nodejs
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""


containerPort: 8080


config:
  NODE_ENV: production
  NODE_OPTIONS: "--max-old-space-size=96"


existingSecret: ""

secret: {}


serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

metrics:
  scrapeAnnotations: true
  path: /metrics

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]


shareProcessNamespace: true

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: traefik
  annotations: {}
  securityHeaders:
    enabled: true
    removeResponseHeaders: [X-Powered-By, Server]
  host: app.34.56.31.129.nip.io
  paths:
    - path: /my-app
      pathType: Exact
    - path: /about
      pathType: Exact
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

probes:

  startup:
    path: /live
    periodSeconds: 2
    failureThreshold: 15

  readiness:
    path: /ready
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3

  liveness:
    path: /live
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

revisionHistoryLimit: 5
terminationGracePeriodSeconds: 20
preStopSleepSeconds: 5

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

topologySpread:
  enabled: true
  maxSkew: 1
  whenUnsatisfiable: ScheduleAnyway

networkPolicy:
  enabled: false
  ingressNamespaces:
    - kube-system

nodeSelector: {}
tolerations: []
affinity: {}
