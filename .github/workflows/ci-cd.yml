
name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:


permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/sample-nodejs
  NODE_VERSION: "24"

jobs:

  secrets:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Gitleaks (full history, redacted)
        run: |
          set +e
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git . --redact --no-banner --exit-code 1 \
            --report-format json --report-path gitleaks.json
          rc=$?
          set -e
          if [ -s gitleaks.json ]; then
            jq -r '.[] | "::error file=\(.File),line=\(.StartLine),title=Gitleaks \(.RuleID)::\(.Description) (commit \(.Commit[0:7]))"' gitleaks.json
          fi
          exit $rc

  sast:
    name: SAST (SonarQube)
    runs-on: ubuntu-latest

    services:
      sonarqube:
        image: sonarqube:26.10.0.133078-community@sha256:aa0d41212704d1ed35f7ae3b49886b39f639590baf8020cdb191c2a2eb8f9eae
        ports: ["9000:9000"]
        env:
          SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    env:
      SONAR_HOST_URL: http://localhost:9000
      SONAR_PROJECT_KEY: sample-nodejs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Prepare SonarQube (rotate admin password, strict Quality Gate, token)
        run: bash .github/scripts/sonarqube-setup.sh
      - name: SonarQube scan + wait for Quality Gate
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
      - name: Publish SonarQube results (summary + annotations)
        if: always() && env.SONAR_ADMIN_PW != ''
        run: bash .github/scripts/sonarqube-report.sh

  sca:
    name: Dependency scan (npm audit + Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install exactly what the lockfile says (no install scripts)
        run: npm ci --ignore-scripts --no-fund
      - name: npm audit (fail on HIGH/CRITICAL in production deps)
        run: npm audit --omit=dev --audit-level=high
      - name: Trivy filesystem scan (SARIF report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: sarif
          output: trivy-fs.sarif
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce37
        if: always() && hashFiles('trivy-fs.sarif') != ''
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-dependencies
      - name: Trivy filesystem gate (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"
          skip-setup-trivy: true


  config:
    name: Misconfiguration (Hadolint + Trivy config)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Hadolint (Dockerfile best practices)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
      - name: Trivy config scan – Dockerfile + Helm chart (SARIF report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        if: always() && hashFiles('trivy-config.sarif') != ''
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config
      - name: Trivy config gate (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"
          skip-setup-trivy: true


  version:
    name: Compute version (SemVer from Conventional Commits)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      release: ${{ steps.next.outputs.release }}
      previous: ${{ steps.next.outputs.previous }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0            
      - id: next
        run: bash .github/scripts/next-version.sh

  image:
    name: Build, scan and publish image
    needs: [secrets, sast, sca, config, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      IS_RELEASE: ${{ needs.version.outputs.release }}
      LOCAL_TAG: sample-nodejs:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build image (loaded locally, NOT pushed yet)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.LOCAL_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=sample-nodejs
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Trivy image scan (SARIF report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: ${{ env.LOCAL_TAG }}
          format: sarif
          output: trivy-image.sarif
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        if: always() && hashFiles('trivy-image.sarif') != ''
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

    
      - name: Trivy image gate – block on HIGH/CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: ${{ env.LOCAL_TAG }}
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"
          skip-setup-trivy: true

      - name: SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: ${{ env.LOCAL_TAG }}
          format: cyclonedx
          output: sbom.cdx.json
          skip-setup-trivy: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sbom
          path: sbom.cdx.json

      - name: Smoke test (hardened runtime, probes, graceful shutdown)
        run: |
         
          docker run -d --init --name smoke --read-only --cap-drop ALL \
            --security-opt no-new-privileges -p 8080:8080 "$LOCAL_TAG"
          for i in $(seq 1 30); do curl -sf localhost:8080/ready && break; sleep 1; done
          echo; curl -fsS localhost:8080/live; echo
          test "$(curl -fsS localhost:8080/my-app)" = "Hello, World!"
          curl -fsS localhost:8080/metrics | grep -q '^root_access_total 1'
          test "$(docker inspect -f '{{.Config.User}}' smoke)" = "nonroot"
          start=$(date +%s); docker stop -t 10 smoke; took=$(( $(date +%s) - start ))
          docker logs smoke
          echo "stopped in ${took}s, exit code $(docker inspect -f '{{.State.ExitCode}}' smoke)"
          test "$took" -lt 5


      - name: Log in to GHCR
        if: env.IS_RELEASE == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the exact image that was scanned
        if: env.IS_RELEASE == 'true'
        id: push
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          for t in "$VERSION" "sha-$SHORT_SHA"; do
            docker tag "$LOCAL_TAG" "$IMAGE:$t"
            docker push "$IMAGE:$t"
          done
          DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION" | cut -d@ -f2)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Pushed $IMAGE:$VERSION ($DIGEST)" >> "$GITHUB_STEP_SUMMARY"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        if: env.IS_RELEASE == 'true'
      - name: Sign image + attach SBOM attestation (keyless, OIDC)
        if: env.IS_RELEASE == 'true'
        env:
          REF: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$REF"


  release:
    name: Release (bump versions, tag, GitHub Release)
    needs: [image, version]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PREVIOUS: ${{ needs.version.outputs.previous }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: sbom
      - name: Bump package.json and Helm chart
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          sed -i -E "s/^version: .*/version: $VERSION/; s/^appVersion: .*/appVersion: \"$VERSION\"/" helm/sample-nodejs/Chart.yaml
          git diff
      - name: Commit, tag and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json helm/sample-nodejs/Chart.yaml
          git diff --cached --quiet || git commit -m "chore(release): v$VERSION [skip ci]"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin HEAD:main "v$VERSION"
      - name: Create GitHub Release (changelog from commits)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RANGE=${PREVIOUS:+$PREVIOUS..}HEAD~1
          {
            echo "## Image"
            echo "\`${IMAGE}:${VERSION}\` – signed with cosign (keyless), SBOM attached"
            echo
            echo "## Changes"
            git log --no-merges --format='- %s (%h)' $RANGE | grep -v 'chore(release)' || true
          } > notes.md
          gh release create "v$VERSION" --title "v$VERSION" --notes-file notes.md sbom.cdx.json
